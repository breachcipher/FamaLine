# ============================================
# Konfigurasi Xorg Lengkap untuk VirtualBox
# Auto-detect: pilih driver yang tersedia
# ============================================

# ---------- Opsi 1: Framebuffer (fbdev) ----------
# Fallback jika vboxvideo tidak tersedia
Section "Device"
    Identifier  "Framebuffer Card"
    Driver      "fbdev"
    Option      "fbdev" "/dev/fb0"
    Option      "Ignore" "false"
EndSection

Section "Screen"
    Identifier  "Screen_fbdev"
    Device      "Framebuffer Card"
    Monitor     "Monitor0"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Modes   "1376x768" "1024x768" "800x600"
    EndSubSection
EndSection

# ---------- Opsi 2: VirtualBox (vboxvideo) ----------
# Prioritas lebih tinggi jika module tersedia
Section "Device"
    Identifier  "VirtualBox Graphics"
    Driver      "vboxvideo"
    Option      "DynamicResize" "true"
    Option      "AccelMethod"   "sna"
    # Hanya aktif jika module vboxvideo tersedia
    Option      "AutoAddDevices" "true"
EndSection

Section "Screen"
    Identifier  "Screen_vbox"
    Device      "VirtualBox Graphics"
    Monitor     "Monitor0"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Modes   "1920x1080" "1680x1050" "1440x900" "1366x768" "1280x720"
        Virtual 1920 1080
    EndSubSection
EndSection

# ---------- Konfigurasi Umum ----------
Section "Monitor"
    Identifier  "Monitor0"
    Option      "DPMS" "true"
EndSection

Section "ServerLayout"
    Identifier  "Layout0"
    Screen      "Screen_vbox"  # Prioritaskan vboxvideo
    Option      "AllowEmptyInitialConfiguration" "true"
EndSection

# Fallback: jika vboxvideo gagal, pakai fbdev
Section "ServerFlags"
    Option      "IgnoreABI" "true"
    Option      "AutoAddGPU" "true"
EndSection
